 <style>
 body{

 }

text-align: center;

 header h4{

 }   
    h4{

   body{
display:flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin:0;
 } 
 .galeria{
     width: 650px;
     height: 200px;

     display: grid;
     grid-template-columns: 2fr 1fr;
     grid-template-rows: 1fr 1fr;
     gap:10px;
 }
 .galeria img{
     width: 100%;
     height: 100%;
     object-fit:  cover;
     border-radius: 20px;
    }
    .img{
        grid-row: 1 / 3;

    }
    
    
    </style>
    <body> 
<p>MOMENTOS QUE QUEDAN</p>
<header id="inicio">
    <h4> LA GRADUACION SE ACERCA </h4>
    <div class="galeria">
        <img scr="imagenes.jpg" alt="imagen grande"class="img1">
        <img src="imagenes.jpg" alt="imagen pequeña"class="img2">
        <img src="imagenes.jpg" alt="imagen pequeña"class="img3">
    </div>
</header>









    </body>
    </html>
