<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Estudiantes</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-image: url("https://images.unsplash.com/photo-1600206287932-4b8888bd78f6?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fHZlcmRlJTIwcGFpc2FqZXxlbnwwfHwwfHx8MA%3D%3D");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin:0;
    padding:20px;
}

.registro-contenedor{
    width:400px;
    margin:auto;
    background:#b8f27c;
    padding:25px;
    border-radius:5px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#FFD700;
    margin-bottom:20px;
}

.grupo-formulario{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
    color:#222;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px;
    box-sizing:border-box;
    font-size:15px;
    background-color: white;
    color: black;
}

textarea{
    resize:none;
    height:100px;
}

button{
    width:100%;
    padding:12px;
    background:#66cc66;
    color:white;
    border:none;
    border-radius:4px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#55bb55;
}
</style>

</head>
<body>

<div class="registro-contenedor">

    <h2>Registro de estudiantes</h2>

    <form>

        <div class="grupo-formulario">
            <label>Nombre:</label>
            <input type="text" placeholder="Ingrese su nombre" required>
        </div>

        <div class="grupo-formulario">
            <label>Correo:</label>
            <input type="email" placeholder="Ingrese su correo" required>
        </div>

        <div class="grupo-formulario">
            <label>Contraseña:</label>
            <input type="password" placeholder="Ingrese su contraseña" required>
        </div>

        <div class="grupo-formulario">
            <label>Género:</label>
            <select required>
                <option>Masculino</option>
                <option>Femenino</option>
            </select>
        </div>

        <div class="grupo-formulario">
            <label>Mensaje:</label>
            <textarea placeholder="Escriba un mensaje"></textarea>
        </div>

        <button type="submit">registrado</button>

    </form>

</div>

</body>
</html>
